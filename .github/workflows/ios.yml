name: ios

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the build should talk to (e.g. https://instaca-api.onrender.com)"
        required: false
        default: ""
  push:
    tags: ["ios-v*"]

jobs:
  simulator:
    name: simulator build (no signing required)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Write .env
        run: |
          API="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API" ]; then
            echo "No api_base_url given — falling back to .env.example."
            cp .env.example .env
          else
            WS=$(echo "$API" | sed 's|^https://|wss://|; s|^http://|ws://|')
            {
              echo "API_BASE_URL=$API"
              echo "WS_BASE_URL=$WS"
              echo "DEFAULT_GST_RATE_PERCENT=18"
            } > .env
          fi
          echo "── .env used for this build ──"
          cat .env

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/InstaCA.xcworkspace \
            -scheme InstaCA \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package the .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -rq "$GITHUB_WORKSPACE/InstaCA-simulator.zip" InstaCA.app
          ls -lh "$GITHUB_WORKSPACE/InstaCA-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: InstaCA-ios-simulator
          path: InstaCA-simulator.zip
          retention-days: 30
