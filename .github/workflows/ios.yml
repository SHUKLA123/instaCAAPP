name: ios

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the build should talk to (e.g. https://instaca-api.onrender.com)"
        required: false
        default: ""

jobs:
  simulator:
    name: simulator build (no signing required)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Write .env
        run: |
          API="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API" ]; then
            echo "No api_base_url given — falling back to .env.example."
            cp .env.example .env
          else
            WS=$(echo "$API" | sed 's|^https://|wss://|; s|^http://|ws://|')
            {
              echo "API_BASE_URL=$API"
              echo "WS_BASE_URL=$WS"
              echo "DEFAULT_GST_RATE_PERCENT=18"
            } > .env
          fi
          echo "── .env used for this build ──"
          cat .env

      # Cache key carries "oldarch": turning the New Architecture off changes
      # which pods are generated, and a cache from a new-arch run would quietly
      # reintroduce the Fabric pods this build no longer wants.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-oldarch-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-oldarch-

      # RCT_NEW_ARCH_ENABLED=0 is the iOS half of newArchEnabled=false on
      # Android. RN 0.76 turns the New Architecture ON BY DEFAULT on iOS — the
      # failing build showed -DRCT_NEW_ARCH_ENABLED=1 on every compile line —
      # which is why RNSVGLayoutableShadowNode.cpp was being compiled at all.
      # It must be set for `pod install`: that is what decides which pods exist.
      - name: pod install
        working-directory: ios
        env:
          RCT_NEW_ARCH_ENABLED: "0"
        run: pod install --repo-update

      - name: Toolchain versions
        run: |
          xcodebuild -version
          pod --version
          echo "--- available schemes ---"
          xcodebuild -workspace ios/InstaCA.xcworkspace -list

      - name: Build for the simulator
        env:
          RCT_NEW_ARCH_ENABLED: "0"
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/InstaCA.xcworkspace \
            -scheme InstaCA \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/xcodebuild.log \
            || {
              echo "=================== BUILD FAILED ==================="
              grep -n "error:" /tmp/xcodebuild.log | head -40 || true
              echo "--- last 200 lines ---"
              tail -200 /tmp/xcodebuild.log
              exit 1
            }

      - name: Package the .app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -rq "$GITHUB_WORKSPACE/InstaCA-simulator.zip" InstaCA.app
          ls -lh "$GITHUB_WORKSPACE/InstaCA-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: InstaCA-ios-simulator
          path: InstaCA-simulator.zip
          retention-days: 30
