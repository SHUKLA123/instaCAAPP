pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'InstaCA'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// react-native-config is NOT picked up by autolinking: `npx react-native config`
// reports platforms.android = null for it, so the Gradle project it needs never
// gets created. app/build.gradle then fails on
//   Project with path ':react-native-config' could not be found
// and, because :app never finishes evaluating, Gradle also reports the
// misleading follow-on error "compileSdkVersion is not specified".
// Wiring the library project in by hand is what the package's own docs call for.
include ':react-native-config'
project(':react-native-config').projectDir =
    new File(rootProject.projectDir, '../node_modules/react-native-config/android')
